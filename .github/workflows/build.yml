name: build

# Runs only when started manually from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "构建与发布的版本"
        type: choice
        options:
          - Windows
          - Android
          - Windows 和 Android
        default: Windows
      release:
        description: "同时发布 Release：Windows 使用下方版本号，Android 使用 app/build.gradle.kts 中的版本号，标签为 android-v版本号"
        type: boolean
        default: false
      version:
        description: "Windows 版的 Release 版本号（如 v1.0.0），仅在发布 Windows 版时使用"
        type: string
        required: false
      notes:
        description: "Windows 版更新日志：多条用 ； 或 | 分隔；也可用 \\n 换行写 Markdown。留空则使用 CHANGELOG.md 中的对应章节"
        type: string
        required: false
      android_notes:
        description: "Android 版更新日志，写法同上。留空则使用 src/android/CHANGELOG.md 中的对应章节"
        type: string
        required: false
      mirror:
        description: "上传到 R2 国内直链并同步下载页，仅在发布 Release 时生效"
        type: boolean
        default: true
      sign_test:
        description: "仅测试 Windows 版代码签名：提交 SignPath 签名并上传签名后的文件，不发布 Release"
        type: boolean
        default: false

permissions:
  contents: write
  # Starts deploy-docs.yml after the download page is synced.
  actions: write

jobs:
  windows:
    if: contains(inputs.target, 'Windows')
    runs-on: windows-latest
    env:
      RELEASE: ${{ inputs.release }}
      VERSION: ${{ inputs.version }}
      NOTES: ${{ inputs.notes }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Prepare release notes
        if: inputs.release
        shell: pwsh
        run: |
          if ($env:VERSION -notmatch '^v\d+\.\d+\.\d+$') {
            Write-Error "发布 Release 需要填写版本号，格式如 v1.0.0"
            exit 1
          }

          $notes = "$env:NOTES".Trim()
          if ($notes) {
            if ($notes.Contains('\n')) {
              # Free-form Markdown, "\n" marks a line break.
              $body = $notes -split '\\n' | ForEach-Object { $_.TrimEnd() }
            }
            else {
              # One bullet per item, separated by "；", ";" or "|".
              $items = $notes -split '[；;|]' | ForEach-Object { $_.Trim() } | Where-Object { $_ }
              $body = @('### 更新内容', '') + ($items | ForEach-Object { "- $_" })
            }
          }
          else {
            # Take the "## <version>" section of CHANGELOG.md, up to the next "## " heading.
            $lines = Get-Content CHANGELOG.md -Encoding utf8
            $start = [Array]::IndexOf($lines, "## $env:VERSION")
            if ($start -lt 0) {
              Write-Error "没有填写更新日志，CHANGELOG.md 中也没有 “## $env:VERSION” 章节"
              exit 1
            }
            $end = $start + 1
            while ($end -lt $lines.Count -and -not $lines[$end].StartsWith('## ')) { $end++ }
            $body = $lines[($start + 1)..($end - 1)]
          }
          $body | Set-Content release-notes.md -Encoding utf8

      - name: Build
        shell: pwsh
        env:
          # Repository variable with the update service address. Only release builds get it.
          SERVICE_URL: ${{ vars.SERVICE_URL }}
        run: |
          $properties = @()
          if ($env:RELEASE -eq 'true') {
            if (-not $env:SERVICE_URL) {
              Write-Error "发布 Release 所需的服务地址尚未配置"
              exit 1
            }
            $properties += "-p:Version=$($env:VERSION.TrimStart('v'))"
            $properties += "-p:ServiceUrl=$env:SERVICE_URL"
          }
          dotnet build src/Campfire/Campfire.csproj -c Release @properties
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: Campfire
          path: src/Campfire/bin/Release/Campfire.exe

      # Submits the unsigned Campfire.exe to SignPath and waits for the signed file.
      - name: Code signing (SignPath)
        if: inputs.release || inputs.sign_test
        id: signpath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Replace with signed file
        if: inputs.release || inputs.sign_test
        shell: pwsh
        run: |
          if (-not (Test-Path signed/Campfire.exe)) {
            Write-Error "SignPath 没有返回签名后的 Campfire.exe"
            exit 1
          }
          Copy-Item signed/Campfire.exe src/Campfire/bin/Release/Campfire.exe -Force

      # Prints the Authenticode signature of the signed file.
      - name: Show signature
        if: inputs.release || inputs.sign_test
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature src/Campfire/bin/Release/Campfire.exe
          $signature | Format-List Status, StatusMessage, SignerCertificate
          if (-not $signature.SignerCertificate) {
            Write-Error "文件没有数字签名"
            exit 1
          }

      - name: Upload signed artifact
        if: inputs.sign_test && !inputs.release
        uses: actions/upload-artifact@v4
        with:
          name: Campfire-signed
          path: src/Campfire/bin/Release/Campfire.exe

      # Runs after the code signing step; the signature covers the signed file.
      - name: Sign
        if: inputs.release
        shell: pwsh
        env:
          # Created with tools/new-signing-key.ps1. Campfire only installs updates signed with this key.
          CAMPFIRE_SIGNING_KEY: ${{ secrets.CAMPFIRE_SIGNING_KEY }}
        run: ./tools/sign.ps1 -File src/Campfire/bin/Release/Campfire.exe

      - name: Append checksum
        if: inputs.release
        shell: pwsh
        run: |
          $hash = (Get-FileHash src/Campfire/bin/Release/Campfire.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content release-notes.md -Encoding utf8 -Value @("", "### 文件校验", "", "``Campfire.exe`` SHA256：``$hash``")

      # Runs before the release is published.
      - name: Upload to R2
        if: inputs.release && inputs.mirror
        shell: pwsh
        env:
          # API token with R2 "Object Read & Write" on the bucket.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Bucket name and the public address it is served from, e.g. https://dl.example.com/
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          DOWNLOAD_URL: ${{ vars.DOWNLOAD_URL }}
        run: |
          if (-not $env:CLOUDFLARE_API_TOKEN -or -not $env:CLOUDFLARE_ACCOUNT_ID -or -not $env:R2_BUCKET -or -not $env:DOWNLOAD_URL) {
            Write-Error "上传 R2 所需的配置不完整"
            exit 1
          }

          # Every version gets its own folder.
          foreach ($name in 'Campfire.exe', 'Campfire.exe.sig') {
            # --remote writes to the real bucket.
            npx --yes wrangler@4 r2 object put "$env:R2_BUCKET/$env:VERSION/$name" `
              --file "src/Campfire/bin/Release/$name" --remote `
              --content-type application/octet-stream `
              --cache-control "public, max-age=31536000, immutable"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Publish release
        if: inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Campfire ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: |
            src/Campfire/bin/Release/Campfire.exe
            src/Campfire/bin/Release/Campfire.exe.sig

      # The docs site reads docs/.vitepress/release.json to show the version and mirror link on its download page.
      - name: Sync download page
        if: inputs.release && inputs.mirror
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DOWNLOAD_URL: ${{ vars.DOWNLOAD_URL }}
          BRANCH: ${{ github.ref_name }}
        run: |
          $exe = 'src/Campfire/bin/Release/Campfire.exe'
          $release = [ordered]@{
            version = $env:VERSION
            date    = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
            mirror  = $env:DOWNLOAD_URL
            app     = [ordered]@{
              file   = "$env:VERSION/Campfire.exe"
              size   = (Get-Item $exe).Length
              sha256 = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          # Updating an existing file needs its blob sha; the file may also not exist yet.
          $api = "repos/$env:GITHUB_REPOSITORY/contents/docs/.vitepress/release.json"
          $current = gh api "${api}?ref=$env:BRANCH" 2>$null
          $sha = $null
          if ($LASTEXITCODE -eq 0 -and $current) {
            $current = $current | ConvertFrom-Json
            $sha = $current.sha
            # Keeps the android entry written by the Android job.
            $old = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($current.content -replace '\s', ''))) | ConvertFrom-Json
            if ($old.android) { $release.android = $old.android }
          }

          $json = ($release | ConvertTo-Json -Depth 4) -replace "`r`n", "`n"
          $content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($json + "`n"))
          $request = @('--method', 'PUT', $api,
                       '-f', "message=docs: 下载页同步至 $env:VERSION",
                       '-f', "content=$content",
                       '-f', "branch=$env:BRANCH")
          if ($sha) { $request += @('-f', "sha=$sha") }
          gh api @request --jq .commit.html_url
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Starts the docs workflow explicitly.
          gh workflow run deploy-docs.yml --ref $env:BRANCH
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  android:
    # Runs after the Windows job when both are built.
    needs: windows
    if: always() && contains(inputs.target, 'Android') && needs.windows.result != 'failure' && needs.windows.result != 'cancelled'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/android
    env:
      NOTES: ${{ inputs.android_notes }}
    steps:
      - uses: actions/checkout@v4

      # The ZeroUI commit the app is built with.
      - name: Read ZeroUI commit
        id: zeroui
        run: echo "commit=$(tr -d '[:space:]' < zeroui-commit.txt)" >> "$GITHUB_OUTPUT"

      # Checks out ZeroUI at src/android/zeroui; a private ZeroUI needs the ZEROUI_TOKEN secret.
      - uses: actions/checkout@v4
        with:
          repository: Xocio/ZeroUI
          ref: ${{ steps.zeroui.outputs.commit }}
          path: src/android/zeroui
          token: ${{ secrets.ZEROUI_TOKEN || github.token }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Version name of the app, e.g. 0.1.0, and the release tag android-v0.1.0.
      - name: Read version
        run: |
          version=$(sed -n 's/^ *versionName = "\([0-9][0-9.]*\)".*/\1/p' app/build.gradle.kts)
          if [ -z "$version" ]; then
            echo "::error::无法从 app/build.gradle.kts 读取 versionName"
            exit 1
          fi
          echo "VERSION=v$version" >> "$GITHUB_ENV"
          echo "TAG=android-v$version" >> "$GITHUB_ENV"

      # Unit tests, lint, debug build, token check, release builds and size limits.
      - name: Run merge gates
        run: bash tools/ci.sh

      - name: Upload debug package
        uses: actions/upload-artifact@v4
        with:
          name: Campfire-android-debug
          path: src/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build official release
        if: inputs.release
        env:
          # Repository variable with the Campfire service address.
          SERVICE_URL: ${{ vars.SERVICE_URL }}
        run: |
          if [ -z "$SERVICE_URL" ]; then
            echo "::error::发布包所需的服务地址尚未配置"
            exit 1
          fi
          bash ./gradlew :app:assembleRelease "-Pcampfire.serviceUrl=$SERVICE_URL"

      # Signs the release package with the keystore stored as a base64 secret.
      - name: Sign release
        if: inputs.release
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::签名所需的密钥库配置不完整"
            exit 1
          fi
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          keystore="$RUNNER_TEMP/release.jks"
          echo "$ANDROID_KEYSTORE" | base64 -d > "$keystore"
          "$build_tools/apksigner" sign \
            --ks "$keystore" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out Campfire.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          rm -f "$keystore"
          "$build_tools/apksigner" verify --print-certs Campfire.apk

      - name: Upload signed package
        if: inputs.release
        uses: actions/upload-artifact@v4
        with:
          name: Campfire-android
          path: src/android/Campfire.apk

      - name: Prepare release notes
        if: inputs.release
        run: |
          notes=$(printf '%s' "$NOTES" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [ -z "$notes" ]; then
            # Takes the "## <version>" section of CHANGELOG.md, up to the next "## " heading.
            if [ -f CHANGELOG.md ]; then
              tr -d '\r' < CHANGELOG.md | awk -v head="## $VERSION" '
                $0 == head { found = 1; next }
                found && /^## / { exit }
                found { print }
              ' | sed -e '/./,$!d' | sed -e ':a' -e '/^\n*$/{$d;N;ba' -e '}' > release-notes.md
            fi
            if [ ! -s release-notes.md ]; then
              echo "::error::没有填写更新日志，src/android/CHANGELOG.md 中也没有 “## $VERSION” 章节"
              exit 1
            fi
          elif printf '%s' "$notes" | grep -qF '\n'; then
            # Free-form Markdown, "\n" marks a line break.
            printf '%s\n' "$notes" | sed 's/\\n/\n/g' > release-notes.md
          else
            # One bullet per item, separated by "；", ";" or "|".
            {
              echo '### 更新内容'
              echo
              printf '%s\n' "$notes" | sed 's/；/\n/g;s/[;|]/\n/g' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d;s/^/- /'
            } > release-notes.md
          fi
          hash=$(sha256sum Campfire.apk | cut -d' ' -f1)
          printf '\n### 文件校验\n\n`Campfire.apk` SHA256：`%s`\n' "$hash" >> release-notes.md

      # Runs before the release is published.
      - name: Upload to R2
        if: inputs.release && inputs.mirror
        env:
          # API token with R2 "Object Read & Write" on the bucket.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          DOWNLOAD_URL: ${{ vars.DOWNLOAD_URL }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$R2_BUCKET" ] || [ -z "$DOWNLOAD_URL" ]; then
            echo "::error::上传 R2 所需的配置不完整"
            exit 1
          fi
          # Every version gets its own folder under android/.
          npx --yes wrangler@4 r2 object put "$R2_BUCKET/android/$VERSION/Campfire.apk" \
            --file Campfire.apk --remote \
            --content-type application/vnd.android.package-archive \
            --cache-control "public, max-age=31536000, immutable"

      # Not marked as latest: releases/latest stays the desktop release.
      - name: Publish release
        if: inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Campfire Android ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: src/android/release-notes.md
          make_latest: "false"
          files: src/android/Campfire.apk

      # Writes the android entry of docs/.vitepress/release.json and keeps the desktop entries.
      - name: Sync download page
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          MIRROR: ${{ inputs.mirror }}
          BRANCH: ${{ github.ref_name }}
        run: |
          api="repos/$GITHUB_REPOSITORY/contents/docs/.vitepress/release.json"
          current=$(gh api "$api?ref=$BRANCH" 2>/dev/null || true)
          sha=$(printf '%s' "$current" | jq -r '.sha // empty' 2>/dev/null || true)
          if [ -n "$sha" ]; then
            printf '%s' "$current" | jq -r '.content' | base64 -d > release.json
          else
            echo '{}' > release.json
          fi

          file=""
          if [ "$MIRROR" = "true" ]; then file="android/$VERSION/Campfire.apk"; fi
          jq --arg version "$VERSION" --arg tag "$TAG" \
             --arg date "$(date -u +%Y-%m-%d)" --arg file "$file" \
             --argjson size "$(stat -c %s Campfire.apk)" \
             --arg sha256 "$(sha256sum Campfire.apk | cut -d' ' -f1)" \
             '.android = ({version: $version, tag: $tag, date: $date, size: $size, sha256: $sha256} + (if $file == "" then {} else {file: $file} end))' \
             release.json > release.new.json

          request=(--method PUT "$api"
                   -f "message=docs: 安卓版下载页同步至 $VERSION"
                   -f "content=$(base64 -w0 release.new.json)"
                   -f "branch=$BRANCH")
          if [ -n "$sha" ]; then request+=(-f "sha=$sha"); fi
          gh api "${request[@]}" --jq .commit.html_url

          # Starts the docs workflow explicitly.
          gh workflow run deploy-docs.yml --ref "$BRANCH"
