name: build

# Runs only when started manually from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      sign_test:
        description: "仅测试代码签名：提交 SignPath 签名并上传签名后的文件，不发布 Release"
        type: boolean
        default: false
      release:
        description: "同时发布 Release"
        type: boolean
        default: false
      version:
        description: "Release 版本号（如 v1.0.0），仅在发布 Release 时使用"
        type: string
        required: false
      notes:
        description: "更新日志：多条用 ； 或 | 分隔；也可用 \\n 换行写 Markdown。留空则使用 CHANGELOG.md 中的对应章节"
        type: string
        required: false
      mirror:
        description: "上传到 R2 国内直链并同步下载页，仅在发布 Release 时生效"
        type: boolean
        default: true

permissions:
  contents: write
  # Starts deploy-docs.yml after the download page is synced.
  actions: write

jobs:
  build:
    runs-on: windows-latest
    env:
      RELEASE: ${{ inputs.release }}
      VERSION: ${{ inputs.version }}
      NOTES: ${{ inputs.notes }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Prepare release notes
        if: inputs.release
        shell: pwsh
        run: |
          if ($env:VERSION -notmatch '^v\d+\.\d+\.\d+$') {
            Write-Error "发布 Release 需要填写版本号，格式如 v1.0.0"
            exit 1
          }

          $notes = "$env:NOTES".Trim()
          if ($notes) {
            if ($notes.Contains('\n')) {
              # Free-form Markdown, "\n" marks a line break.
              $body = $notes -split '\\n' | ForEach-Object { $_.TrimEnd() }
            }
            else {
              # One bullet per item, separated by "；", ";" or "|".
              $items = $notes -split '[；;|]' | ForEach-Object { $_.Trim() } | Where-Object { $_ }
              $body = @('### 更新内容', '') + ($items | ForEach-Object { "- $_" })
            }
          }
          else {
            # Take the "## <version>" section of CHANGELOG.md, up to the next "## " heading.
            $lines = Get-Content CHANGELOG.md -Encoding utf8
            $start = [Array]::IndexOf($lines, "## $env:VERSION")
            if ($start -lt 0) {
              Write-Error "没有填写更新日志，CHANGELOG.md 中也没有 “## $env:VERSION” 章节"
              exit 1
            }
            $end = $start + 1
            while ($end -lt $lines.Count -and -not $lines[$end].StartsWith('## ')) { $end++ }
            $body = $lines[($start + 1)..($end - 1)]
          }
          $body | Set-Content release-notes.md -Encoding utf8

      - name: Build
        shell: pwsh
        env:
          # Repository variable with the update service address. Only release builds get it.
          SERVICE_URL: ${{ vars.SERVICE_URL }}
        run: |
          $properties = @()
          if ($env:RELEASE -eq 'true') {
            if (-not $env:SERVICE_URL) {
              Write-Error "发布 Release 所需的服务地址尚未配置"
              exit 1
            }
            $properties += "-p:Version=$($env:VERSION.TrimStart('v'))"
            $properties += "-p:ServiceUrl=$env:SERVICE_URL"
          }
          dotnet build src/Campfire/Campfire.csproj -c Release @properties
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: Campfire
          path: src/Campfire/bin/Release/Campfire.exe

      # Submits the unsigned Campfire.exe to SignPath and waits for the signed file.
      - name: Code signing (SignPath)
        if: inputs.release || inputs.sign_test
        id: signpath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Replace with signed file
        if: inputs.release || inputs.sign_test
        shell: pwsh
        run: |
          if (-not (Test-Path signed/Campfire.exe)) {
            Write-Error "SignPath 没有返回签名后的 Campfire.exe"
            exit 1
          }
          Copy-Item signed/Campfire.exe src/Campfire/bin/Release/Campfire.exe -Force

      # Prints the Authenticode signature of the signed file.
      - name: Show signature
        if: inputs.release || inputs.sign_test
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature src/Campfire/bin/Release/Campfire.exe
          $signature | Format-List Status, StatusMessage, SignerCertificate
          if (-not $signature.SignerCertificate) {
            Write-Error "文件没有数字签名"
            exit 1
          }

      - name: Upload signed artifact
        if: inputs.sign_test && !inputs.release
        uses: actions/upload-artifact@v4
        with:
          name: Campfire-signed
          path: src/Campfire/bin/Release/Campfire.exe

      # Runs after the code signing step; the signature covers the signed file.
      - name: Sign
        if: inputs.release
        shell: pwsh
        env:
          # Created with tools/new-signing-key.ps1. Campfire only installs updates signed with this key.
          CAMPFIRE_SIGNING_KEY: ${{ secrets.CAMPFIRE_SIGNING_KEY }}
        run: ./tools/sign.ps1 -File src/Campfire/bin/Release/Campfire.exe

      - name: Append checksum
        if: inputs.release
        shell: pwsh
        run: |
          $hash = (Get-FileHash src/Campfire/bin/Release/Campfire.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content release-notes.md -Encoding utf8 -Value @("", "### 文件校验", "", "``Campfire.exe`` SHA256：``$hash``")

      # Runs before the release is published.
      - name: Upload to R2
        if: inputs.release && inputs.mirror
        shell: pwsh
        env:
          # API token with R2 "Object Read & Write" on the bucket.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Bucket name and the public address it is served from, e.g. https://dl.example.com/
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          DOWNLOAD_URL: ${{ vars.DOWNLOAD_URL }}
        run: |
          if (-not $env:CLOUDFLARE_API_TOKEN -or -not $env:CLOUDFLARE_ACCOUNT_ID -or -not $env:R2_BUCKET -or -not $env:DOWNLOAD_URL) {
            Write-Error "上传 R2 所需的配置不完整"
            exit 1
          }

          # Every version gets its own folder.
          foreach ($name in 'Campfire.exe', 'Campfire.exe.sig') {
            # --remote writes to the real bucket.
            npx --yes wrangler@4 r2 object put "$env:R2_BUCKET/$env:VERSION/$name" `
              --file "src/Campfire/bin/Release/$name" --remote `
              --content-type application/octet-stream `
              --cache-control "public, max-age=31536000, immutable"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Publish release
        if: inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Campfire ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: |
            src/Campfire/bin/Release/Campfire.exe
            src/Campfire/bin/Release/Campfire.exe.sig

      # The docs site reads docs/.vitepress/release.json to show the version and mirror link on its download page.
      - name: Sync download page
        if: inputs.release && inputs.mirror
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DOWNLOAD_URL: ${{ vars.DOWNLOAD_URL }}
          BRANCH: ${{ github.ref_name }}
        run: |
          $exe = 'src/Campfire/bin/Release/Campfire.exe'
          $release = [ordered]@{
            version = $env:VERSION
            date    = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
            mirror  = $env:DOWNLOAD_URL
            app     = [ordered]@{
              file   = "$env:VERSION/Campfire.exe"
              size   = (Get-Item $exe).Length
              sha256 = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          $json = ($release | ConvertTo-Json -Depth 3) -replace "`r`n", "`n"
          $content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($json + "`n"))

          # Updating an existing file needs its blob sha; the file may also not exist yet.
          $api = "repos/$env:GITHUB_REPOSITORY/contents/docs/.vitepress/release.json"
          $sha = gh api "${api}?ref=$env:BRANCH" --jq .sha 2>$null
          $request = @('--method', 'PUT', $api,
                       '-f', "message=docs: 下载页同步至 $env:VERSION",
                       '-f', "content=$content",
                       '-f', "branch=$env:BRANCH")
          if ($LASTEXITCODE -eq 0 -and $sha) { $request += @('-f', "sha=$sha") }
          gh api @request --jq .commit.html_url
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Starts the docs workflow explicitly.
          gh workflow run deploy-docs.yml --ref $env:BRANCH
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
